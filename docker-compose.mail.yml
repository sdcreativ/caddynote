# Overlay Mailpit — messagerie locale (capture SMTP, UI web).
#
#   docker compose -f docker-compose.yml -f docker-compose.mail.yml --profile mail up -d
#
# UI : http://localhost:8025
# SMTP (hôte → API en `npm run dev`) : localhost:1025
# SMTP (API en conteneur) : mailpit:1025 (injecté ci-dessous)
#
# Les e-mails ne quittent pas la machine. Autorisé même si CADDYNOTE_TEST_MODE=true
# (relais local détecté via SMTP_HOST=mailpit|localhost|127.0.0.1).

services:
  caddynote-mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.27
    container_name: caddynote-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - caddynote-net
    labels:
      - "project=CaddyNote"
      - "service=mailpit"

  caddynote-api:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_NO_AUTH: "true"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "CaddyNote Local <noreply@caddynote.local>"
      MAILPIT_UI_URL: http://localhost:${MAILPIT_UI_PORT:-8025}
    depends_on:
      caddynote-mailpit:
        condition: service_started

  caddynote-worker:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_NO_AUTH: "true"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "CaddyNote Local <noreply@caddynote.local>"
    depends_on:
      caddynote-mailpit:
        condition: service_started
