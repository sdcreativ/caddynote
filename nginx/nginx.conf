# ==============================================================================
# Configuration Nginx pour CaddyNote (Application React)
# ==============================================================================

server {
    # Écoute sur le port 80 pour les requêtes IPv4 et IPv6.
    listen 80;
    listen [::]:80;

    # Le nom du serveur. '_' est une valeur "catch-all" pratique si c'est le seul
    # site sur le serveur. Remplacez-le par votre nom de domaine en production.
    # ex: server_name caddynote.sdcreativ.com;
    server_name _;

    # Définit la racine où se trouvent les fichiers de l'application.
    root /usr/share/nginx/html;
    index index.html;

    # --- Optimisation de la compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    # Liste étendue de types MIME à compresser
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # Pièces / imports via /api (défaut nginx = 1m).
    client_max_body_size 32m;

    # Same-origin API (Docker Hostinger / compose) : le front appelle `/api`.
    # `^~` : prioritaire sur le regex des assets, pour ne pas servir index.html.
    location ^~ /api/ {
        proxy_pass http://caddynote-api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_cookie_path / /;
    }

    # --- En-têtes de sécurité (Security Headers) ---
    # Protège contre le clickjacking. 'SAMEORIGIN' n'autorise l'affichage
    # dans une frame que si elle provient du même domaine.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Protège contre les attaques XSS (Cross-Site Scripting).
    add_header X-XSS-Protection "1; mode=block" always;
    # Empêche le navigateur de deviner le type MIME d'un fichier.
    add_header X-Content-Type-Options "nosniff" always;
    # CSP progressive (pas d’HSTS ici : le conteneur écoute en HTTP interne).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; worker-src 'self' blob:" always;


    # --- Mise en cache des assets statiques ---
    # Les fichiers avec des hashs dans leur nom (JS, CSS, polices, images) peuvent être
    # mis en cache de manière agressive par le navigateur.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|eot|otf|ttf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off; # Optionnel: désactive les logs pour ces fichiers
    }

    # --- Configuration pour l'application Single Page (SPA) ---
    # Cette section est cruciale pour que le routage côté client de React fonctionne.
    location / {
        # Tente de servir le fichier demandé. S'il n'existe pas,
        # renvoie vers index.html pour que React gère la route.
        try_files $uri $uri/ /index.html;

        # Le fichier index.html ne doit jamais être mis en cache par le navigateur
        # pour s'assurer que les utilisateurs obtiennent toujours la dernière version de l'app.
        if ($request_uri = '/index.html') {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # --- Gestion des erreurs ---
    # Redirige les erreurs 404 (non trouvées) vers index.html.
    # React Router s'occupera d'afficher une page "Not Found" si la route n'existe pas.
    error_page 404 /index.html;

    # Cachez la version de Nginx pour des raisons de sécurité
    server_tokens off;
}
