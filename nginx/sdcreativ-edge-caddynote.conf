# HTTPS — reverse proxy vers caddynote-web (réseau Docker sdcreativ_sdcreativ).
# À copier vers /var/www/sdcreativ/docker/nginx/conf.d/ APRÈS le certificat.
# Ne pas remplacer sdcreativ.conf ni kodiva-*.conf. Pas d’HSTS le premier jour.

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name caddynote.sdcreativ.com;

  ssl_certificate /etc/letsencrypt/live/caddynote.sdcreativ.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/caddynote.sdcreativ.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 32m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  resolver 127.0.0.11 valid=30s ipv6=off;

  location / {
    set $upstream_caddynote caddynote-web;
    proxy_pass http://$upstream_caddynote:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
  }
}
