# HTTP — ACME + redirection HTTPS. À copier vers
# /var/www/sdcreativ/docker/nginx/conf.d/ (edge 80/443 existant).
# Ne pas remplacer sdcreativ.conf ni kodiva-*.conf.

server {
  listen 80;
  listen [::]:80;
  server_name caddynote.sdcreativ.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://caddynote.sdcreativ.com$request_uri;
  }
}
