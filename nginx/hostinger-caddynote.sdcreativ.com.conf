# Vhost Nginx hôte — AJOUTER à la config existante, ne pas remplacer kodiva / sdcreativ.
# Dépôt : /var/www/caddynote (même parent que /var/www/kodiva et /var/www/sdcreativ).
# Public : reverse-proxy vers le conteneur web 127.0.0.1:18080 (pas `root` statique :
# CaddyNote n’est pas un site PHP comme les voisins ; /api doit atteindre l’API).
#
# Placement typique :
#   /etc/nginx/sites-available/caddynote.sdcreativ.com.conf
#   ln -s ... /etc/nginx/sites-enabled/
# Certificat : certbot --nginx -d caddynote.sdcreativ.com

server {
    listen 80;
    listen [::]:80;
    server_name caddynote.sdcreativ.com;

    location /.well-known/acme-challenge/ {
        root /var/www/caddynote;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name caddynote.sdcreativ.com;

    # Remplacer après certbot (chemins fictifs).
    ssl_certificate     /etc/letsencrypt/live/caddynote.sdcreativ.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caddynote.sdcreativ.com/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
