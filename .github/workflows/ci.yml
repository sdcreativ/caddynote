name: CI CaddyNote

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets_guard:
    name: Guard — pas de secrets trackés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/check-no-secrets.mjs

  build_and_test:
    name: Frontend — lint / tests / build
    runs-on: ubuntu-latest
    needs: [secrets_guard]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm test
      - run: npm run lint:compat
      - run: npm run build
        env:
          SKIP_PRERENDER: '1'
      - run: npm run pwa:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: react-build
          path: dist/

  server_tests:
    name: Serveur — vitest (Postgres)
    runs-on: ubuntu-latest
    needs: [secrets_guard]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caddynote
          POSTGRES_PASSWORD: caddynote
          POSTGRES_DB: caddynote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caddynote"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://caddynote:caddynote@localhost:5432/caddynote_test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://caddynote:caddynote@localhost:5432/caddynote_test
      - run: npm audit --audit-level=high

  docker_push:
    name: Build & Push Docker (main only)
    needs: [build_and_test, server_tests]
    # Note: le contexte `secrets` est interdit dans `jobs.*.if`.
    # On mappe les secrets en `env` de job, puis on filtre via `env.*`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Notice si Docker Hub non configuré
        if: env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == ''
        run: echo "::notice::DOCKER_USERNAME / DOCKER_PASSWORD absents — push Docker ignoré"
      - uses: actions/checkout@v7
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      - uses: actions/download-artifact@v8
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        with:
          name: react-build
          path: dist/
      - uses: docker/login-action@v4
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@v4
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
      - name: Build & push web
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/caddynote-web:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/caddynote-web:staging
            ${{ env.DOCKER_USERNAME }}/caddynote:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/caddynote:latest
            ${{ env.DOCKER_USERNAME }}/caddynote:staging
      - name: Build & push API
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/caddynote-api:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/caddynote-api:staging

  # Prod Hostinger (x86) via runner self-hosted.
  # Prérequis VM : labels self-hosted,linux,X64,hostinger + /var/www/caddynote
  # (overlay docker-compose.hostinger.yml + profil antivirus).
  # Les .env gitignorés sont conservés (git reset --hard ne les touche pas).
  # Staging Oracle A1 : workflow Deploy staging (SSH), plus de push auto.
  deploy_hostinger_self_hosted:
    name: Hostinger — self-hosted rebuild
    needs: [build_and_test, server_tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, X64, hostinger]
    timeout-minutes: 60
    steps:
      - name: Pull + compose build + migrate + health
        env:
          HOSTINGER_APP_DIR: ${{ vars.HOSTINGER_APP_DIR }}
        run: |
          set -euo pipefail
          APP_DIR="${HOSTINGER_APP_DIR:-/var/www/caddynote}"
          cd "$APP_DIR"
          echo "Deploying in $APP_DIR @ $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          git fetch origin main
          git reset --hard origin/main
          echo "Now at $(git rev-parse --short HEAD)"
          export HOSTINGER_APP_DIR="$APP_DIR"
          export DEPLOY_GIT_RESET=0
          bash "$APP_DIR/scripts/deploy-hostinger-rebuild.sh"
