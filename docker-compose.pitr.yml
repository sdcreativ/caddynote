# Overlay PITR staging — archive WAL locale (RPO cible ≤ 15 min)
#
# Usage (dev / staging uniquement — jamais en prod élèves sans revue ops) :
#   mkdir -p tmp/pg_wal_archive tmp/pg_basebackups
#   docker compose -f docker-compose.yml -f docker-compose.pitr.yml up -d caddynote-db
#
# Avec staging split :
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.pitr.yml --profile split up -d
#
# Smoke :
#   cd server && npm run drill:pitr
#
# Voir docs/PITR_RUNBOOK.md

services:
  caddynote-db:
    environment:
      CADDYNOTE_PITR: "1"
    volumes:
      # Bind hôte pour inspection smoke sans docker exec (tmp/ gitignoré).
      - ${PITR_WAL_ARCHIVE_PATH:-./tmp/pg_wal_archive}:/var/lib/postgresql/wal_archive
      - ${PITR_BASEBACKUP_PATH:-./tmp/pg_basebackups}:/var/lib/postgresql/basebackups
    # entrypoint image reste docker-entrypoint.sh ; on passe les -c à postgres.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      # Force un switch WAL au plus tard toutes les 15 min → borne RPO archive.
      - -c
      - archive_timeout=900
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
